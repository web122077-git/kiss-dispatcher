name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Per ADR adr-ci-self-hosted-runner-conventions-2026-05-04: use the
# homelab github-lxc runner (label: 10310github).
# No top-level concurrency: the deploy jobs declare their own (with
# cancel-in-progress: false) so two back-to-back pushes do not interleave
# the systemctl restart of kiss-dispatcher@*.service. Lint runs may
# overlap; that is fine since they are idempotent.

jobs:
  smoke:
    runs-on: [self-hosted, 10310github]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5

      - name: Validate JSON + workflow YAML
        run: |
          python3 -c "import json; json.load(open('package.json'))"
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/ci.yml'))"

      - name: node --check on all .mjs
        run: |
          for f in src/*.mjs; do
            echo "check: $f"
            node --check "$f"
          done

      - name: npm install
        run: npm install --no-audit --no-fund 2>&1 | tail -5

      - name: Unit test — diffTouchesGoss
        run: node tests/diff-touches-goss.test.mjs

      - name: Unit test — test-runner
        run: node tests/test-runner.test.mjs

      - name: Unit test — parser fallback (prompt-eng-pm-output-shape)
        run: node tests/parser-fallback.test.mjs

      - name: Unit test — openclaw-tools allow-list gating (T4 openclaw-spike-zdev-2026-05)
        run: node tests/openclaw-tools.test.mjs

      - name: Unit test — complexityEstimate routing heuristic (T3 dispatcher-routing-abstraction-2026-05)
        run: node tests/test_routing.mjs

      - name: Unit test — complexityBump failure-signal bump (T4 dispatcher-routing-abstraction-2026-05)
        run: node tests/test_complexity_bump.mjs

      - name: Unit test — selectBackend routing decision (T5 dispatcher-routing-abstraction-2026-05)
        run: node tests/test_select_backend.mjs

      - name: Wire-up sanity (no top-level throws on import)
        run: |
          # The dispatcher's index.mjs auto-runs main() — we can't import it
          # without booting it. Instead, syntax-check it (already done above)
          # and verify the persona-config path is configurable via env.
          grep -q "PERSONAS_PATH" src/index.mjs
          grep -q "ensureWorkerNode" src/index.mjs
          grep -q "handlePmPushback" src/index.mjs
          grep -q "handleQaVerdict" src/index.mjs
          grep -q "runTest" src/index.mjs
          grep -q "diffTouchesGoss" src/index.mjs
          echo "load-bearing exports present"

  deploy-to-prod:
    runs-on: [self-hosted, 10310github]
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 15
    # Serialize prod deploys: two back-to-back pushes must not interleave
    # the systemctl restart of kiss-dispatcher@*.service on Aton.
    concurrency:
      group: deploy-prod-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Deploy kiss-dispatcher to Aton:/opt/kiss-dispatcher
        run: |
          retry() {
            for i in 1 2 3; do
              if "$@"; then return 0; fi
              echo "Attempt ${i} failed, retrying in 5s..."
              sleep 5
            done
            echo "ERROR: command failed after 3 attempts: $*"
            return 1
          }

          retry rsync -avz --delete \
            --exclude='.git' --exclude='node_modules' --exclude='tests' \
            --exclude='package-lock.json' \
            -e "ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            ./ svc-ansible@10.77.77.2:/opt/kiss-dispatcher/

          retry ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o BatchMode=yes svc-ansible@10.77.77.2 \
            "cd /opt/kiss-dispatcher && npm install --production 2>&1 | tail -5"

          # Restart every kiss-dispatcher@<role>.service instance. The glob
          # is safe: it expands to the currently-loaded instances (doc, etc.).
          # Use || true so an empty match (no roles installed) is a no-op,
          # not a failure.
          retry ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o BatchMode=yes svc-ansible@10.77.77.2 \
            "sudo systemctl restart 'kiss-dispatcher@*.service' 2>&1 || true; sudo systemctl list-units 'kiss-dispatcher@*' --no-pager"

          echo "kiss-dispatcher@*.service restarted on Aton from /opt/kiss-dispatcher"

  deploy-to-zdev:
    runs-on: [self-hosted, zdev-github]
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    timeout-minutes: 15
    concurrency:
      group: deploy-zdev-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Deploy kiss-dispatcher to zdev-aton:/opt/kiss-dispatcher
        run: |
          retry() {
            for i in 1 2 3; do
              if "$@"; then return 0; fi
              echo "Attempt ${i} failed, retrying in 5s..."
              sleep 5
            done
            echo "ERROR: command failed after 3 attempts: $*"
            return 1
          }

          retry rsync -avz --delete \
            --exclude='.git' --exclude='node_modules' --exclude='tests' \
            --exclude='package-lock.json' \
            -e "ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o BatchMode=yes" \
            ./ svc-ansible@10.98.98.10:/opt/kiss-dispatcher/

          retry ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o BatchMode=yes svc-ansible@10.98.98.10 \
            "cd /opt/kiss-dispatcher && npm install --production 2>&1 | tail -5"

          # zdev-aton may not have kiss-dispatcher@*.service units installed yet.
          # Restart anything that IS active; do not fail if no units exist.
          retry ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=accept-new -o BatchMode=yes svc-ansible@10.98.98.10 \
            "sudo systemctl restart 'kiss-dispatcher@*.service' 2>&1 || true; sudo systemctl list-units 'kiss-dispatcher@*' --no-pager 2>&1 || echo 'no kiss-dispatcher@*.service on zdev-aton yet'"

          echo "kiss-dispatcher synced to zdev-aton:/opt/kiss-dispatcher (restart best-effort)"
